backend:
  name: github
  repo: toonayoga/ToonaWebsite
  branch: main
  base_url: https://toona-auth.toonayoga.workers.dev

media_folder: "v2/public/assets/images" # 修正：相对于仓库根目录的路径
public_folder: "/assets/images"         # 修正：相对于部署后网站根目录的路径

collections:
  - name: "globals"
    label: "全局设置"
    delete: false # 防止误删
    editor:
      preview: false # 全局设置不需要实时预览
    files:
      - name: "navigation"
        label: "导航栏链接"
        file: "v2/src/data/navigation.json"
        fields:
          - { label: "Logo (English)", name: "logo", widget: "string" }
          - { label: "Logo (中文)", name: "logo_zh", widget: "string" }
          - label: "英文链接"
            name: "links_en"
            widget: "list"
            fields:
              - { label: "文字", name: "label", widget: "string" }
              - { label: "链接", name: "href", widget: "string" }
          - label: "中文链接"
            name: "links_zh"
            widget: "list"
            fields:
              - { label: "文字", name: "label", widget: "string" }
              - { label: "链接", name: "href", widget: "string" }
      - name: "footer"
        label: "页脚设置"
        file: "v2/src/data/footer.json"
        fields:
          - label: "品牌信息"
            name: "brand"
            widget: "object"
            fields:
              - { label: "标题 (EN)", name: "title_en", widget: "string" }
              - { label: "标题 (ZH)", name: "title_zh", widget: "string" }
              - { label: "描述 (EN)", name: "description_en", widget: "text" }
              - { label: "描述 (ZH)", name: "description_zh", widget: "text" }
          - label: "分类链接"
            name: "sections"
            widget: "list"
            fields:
              - { label: "分类标题 (EN)", name: "title_en", widget: "string" }
              - { label: "分类标题 (ZH)", name: "title_zh", widget: "string" }
              - label: "链接列表"
                name: "links"
                widget: "list"
                fields:
                  - { label: "文字 (EN)", name: "label_en", widget: "string" }
                  - { label: "文字 (ZH)", name: "label_zh", widget: "string" }
                  - { label: "链接 (EN)", name: "url_en", widget: "string" }
                  - { label: "链接 (ZH)", name: "url_zh", widget: "string" }
          - { label: "版权所有者", name: "copyright_owner", widget: "string" }

  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home Page (EN)"
        file: "v2/src/content/pages/home.json"
        fields:
          - {label: "Hero Title", name: "heroTitle", widget: "string"}

          - {label: "Hero Subtitle", name: "heroSubtitle", widget: "text"}
          - {label: "Hero Images", name: "heroImages", widget: "list", field: {label: "Image", name: "image", widget: "image"}}
          - {label: "App Store Link", name: "appStoreLink", widget: "string"}
          - {label: "SEO Description", name: "description", widget: "string"}
          - label: "Features Section"
            name: "features"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "text"}
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Icon (Emoji)", name: "icon", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}
                  - {label: "Background Color", name: "color", widget: "string"}
          - label: "Showcase Section"
            name: "showcase"
            widget: "object"
            fields:
              - {label: "Tag", name: "tag", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Showcase Images", name: "images", widget: "list", field: {label: "Image", name: "image", widget: "image"}}
          - label: "CTA Section (Bottom)"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

      - name: "home_zh"

        label: "首页内容 (中文)"
        file: "v2/src/content/pages/home_zh.json"
        fields:
          - {label: "英雄区标题", name: "heroTitle", widget: "string"}
          - {label: "英雄区副标题", name: "heroSubtitle", widget: "text"}
          - {label: "英雄区图片", name: "heroImages", widget: "list", field: {label: "图片", name: "image", widget: "image"}}
          - {label: "App Store 链接", name: "appStoreLink", widget: "string"}
          - {label: "SEO 描述", name: "description", widget: "string"}
          - label: "功能列表区"
            name: "features"
            widget: "object"
            fields:
              - {label: "标题", name: "title", widget: "string"}
              - {label: "副标题", name: "subtitle", widget: "text"}
              - label: "功能项"
                name: "items"
                widget: "list"
                fields:
                  - {label: "图标 (表情)", name: "icon", widget: "string"}
                  - {label: "标题", name: "title", widget: "string"}
                  - {label: "描述", name: "description", widget: "text"}
                  - {label: "背景颜色", name: "color", widget: "string"}
          - label: "展示区"
            name: "showcase"
            widget: "object"
            fields:
              - {label: "标签", name: "tag", widget: "string"}
              - {label: "标题", name: "title", widget: "string"}
              - {label: "描述", name: "description", widget: "text"}
              - {label: "展示图片", name: "images", widget: "list", field: {label: "图片", name: "image", widget: "image"}}
          - label: "底部下载引导区"
            name: "cta"
            widget: "object"
            fields:
              - {label: "标题", name: "title", widget: "string"}
              - {label: "描述", name: "description", widget: "text"}


