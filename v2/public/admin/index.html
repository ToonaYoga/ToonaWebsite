<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toona CMS Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* 注入一些基础样式，让预览窗口看起来不那么单调 */
    body { margin: 0; padding: 0; }
    .preview-body { font-family: 'Inter', sans-serif; background: #EEF2F0; color: #1A1A1A; }
    .preview-section { padding: 40px 20px; }
    .preview-container { max-width: 800px; margin: 0 auto; }
    
    .preview-hero {
      background: #1A1A1A;
      color: white;
      padding: 80px 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .preview-tag {
      background: rgba(123, 79, 166, 0.2);
      color: #4ECDC4;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 14px;
      margin-bottom: 20px;
      border: 1px solid rgba(78, 205, 196, 0.2);
    }
    .preview-hero h1 { font-size: 42px; line-height: 1.1; margin: 0 0 20px; }
    .preview-hero p { font-size: 18px; color: #9CA3AF; margin: 0 0 30px; max-width: 600px; }
    .preview-btn {
      background: #000;
      color: white;
      padding: 12px 24px;
      border-radius: 99px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .preview-features { background: white; text-align: center; }
    .preview-features h2 { font-size: 32px; margin-bottom: 10px; }
    .preview-features-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 20px; 
      margin-top: 40px; 
    }
    .preview-card {
      padding: 24px;
      border-radius: 20px;
      background: white;
      border: 1px solid #E5E7EB;
      text-align: left;
    }
    .preview-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 15px;
    }

    .preview-showcase { background: #1A1A1A; color: white; display: flex; gap: 40px; align-items: center; }
    .preview-showcase-content { flex: 1; text-align: left; }
    .preview-showcase-img { width: 120px; border-radius: 12px; transform: rotate(-5deg); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
  </style>
</head>
<body>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    const HomePreview = createClass({
      render: function() {
        const { entry, getAsset } = this.props;
        const data = entry.getIn(['data']).toJS();
        
        // Data Extraction with defaults
        const title = data.heroTitle || '';
        const subtitle = data.heroSubtitle || '';
        const features = data.features || { items: [] };
        const showcase = data.showcase || { images: [] };

        const formattedTitle = title.replace(',', ',<br>');

        return h('div', { className: 'preview-body' },
          // Hero
          h('section', { className: 'preview-hero' },
            h('span', { className: 'preview-tag' }, '✦ Breathing Training App'),
            h('h1', { dangerouslySetInnerHTML: { __html: formattedTitle } }),
            h('p', {}, subtitle),
            h('div', { className: 'preview-btn' }, 'Download on App Store')
          ),

          // Features
          h('section', { className: 'preview-section preview-features' },
            h('div', { className: 'preview-container' },
              h('h2', {}, features.title || 'Features Title'),
              h('p', {}, features.subtitle),
              h('div', { className: 'preview-features-grid' },
                (features.items || []).map(item => 
                  h('div', { className: 'preview-card' },
                    h('div', { className: 'preview-icon', style: { background: item.color || '#eee' } }, item.icon),
                    h('h3', {}, item.title),
                    h('p', { style: { fontSize: '14px', color: '#6B7280' } }, item.description)
                  )
                )
              )
            )
          ),

          // Showcase
          h('section', { className: 'preview-section preview-showcase' },
            h('div', { className: 'preview-container', style: { display: 'flex', gap: '40px' } },
              h('div', { style: { display: 'flex', gap: '10px' } },
                (showcase.images || []).map(img => h('img', { src: getAsset(img), className: 'preview-showcase-img' }))
              ),
              h('div', { className: 'preview-showcase-content' },
                h('span', { className: 'preview-tag' }, showcase.tag),
                h('h2', {}, showcase.title),
                h('p', { style: { color: '#9CA3AF' } }, showcase.description)
              )
            )
          )
        );
      }
    });

    CMS.registerPreviewTemplate("home", HomePreview);
    CMS.registerPreviewTemplate("home_zh", HomePreview); // Reuse the same logic
  </script>
</body>

</html>
