<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toona – Bubble Guestbook</title>
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="guestbook-body">

  <!-- 阶段一：CO2 测试长按层 -->
  <div id="co2-overlay" class="overlay">
    <div class="test-container">
      <h2>Hold Your Breath...</h2>
      <p class="intro-text">Breathe deep, start your first session before leaving a message.</p>
      <div id="timer">00.00</div>
      <button id="test-btn" class="hold-btn">PRESS<br><span class="amp">&</span><br>HOLD</button>
      <p class="hint">Release to enter the bubble world.</p>
    </div>
  </div>

  <!-- 阶段二：气泡留言世界 -->
  <main id="bubble-world" class="hidden">
    <div id="ambient-bubbles"></div>
    <div id="bubble-container" class="bubbles-bg"></div>
    
    <div class="input-panel">
      <div id="char-count" class="char-count">0/150</div>
      <input type="text" id="msg-input" placeholder="Breath a deeper thought into a bubble..." maxlength="150">
      <button id="send-btn" class="btn btn-primary">Release</button>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
